HTML

<!DOCTYPE Html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Spending">

   <link rel="apple-touch-icon" sizes="180x180" href="https://icons8.com">
   <link rel="icon" type="image/png" sizes="192x192" href="https://icons8.com">

  <title>My Spending Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="container">
        <h1>Spending monitor</h1>
      <div class="form-section">
           <input type="text" id="expenseName" placeholder="What did you buy?">
           <input type="number" id="expenseAmount" placeholder="Amount">
           <input type="date" id="expenseDate" placeholder="What did you buy?">
           <select id="expenseCategory">
                   <option value="Cafe">Cafe</option>
                   <option value="Food">Food</option>
                   <option value="Petrol">Petrol</option>
                   <option value="Online">Online</option>
                   <option value="PC and Gross">Pc and gross</option>
                   <option value="Subscription">Subscription</option>
                   <option value="Rent">Rent</option>  
            </select>

            <button onclick="addExpenses()">Add Expense</button>
        </div>
        <div class="filter-section'>
             <div class="filter-group">
                  <label>Filter by month:</label>
                  <input type="month" id="filterMonth" onchange="renderExpenses()">
             </div>
             <div class="filter-group">
                  <label>Filer by Category:</label>
                  <select id="filterCategory" onchange="renderExpenses()">
                      <option value="All">All Categories</option>
                      <option value="Cafe">Cafe</option>
                      <option value="Food">Food</option>
                      <option value="Petrol">Petrol</option>
                      <option value="Online">Online</option>
                      <option value="PC and Gross">Pc and gross</option>
                      <option value="Subscription">Subscription</option>
                      <option value="Rent">Rent</option>
                  </select>
             </div>
         </div>
         <div class="total-section">
              <h3>Total for selected month: <span id="totalAmount">0.00</span></h3>
         </div>

         <table>
              <thead>   
                  <tr>
                     <th>Date</th>
                     <th>Item</th>
                     <th>Category</th>
                     <th>Amount</th>
                     <th>Action</th>
                  </tr>
               </thead>
               <tbody id="expenseTableBody">
               </tbody>
     </div>

     <script src="script.js"></script>
</body>
</html>
